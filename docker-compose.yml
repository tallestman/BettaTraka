services:
  # 1. PostgreSQL Database Service
  # Strictly PRIVATE to the internal Docker network (no host ports exposed)
  db:
    image: postgres:16-alpine
    container_name: bettatraka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bettatraka}
      POSTGRES_USER: ${POSTGRES_USER:-bettatraka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bettatraka-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bettatraka_user} -d ${POSTGRES_DB:-bettatraka}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. BettaTraka Web Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bettatraka_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-bettatraka_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bettatraka}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bettatraka-internal

volumes:
  postgres_data:
    driver: local

networks:
  bettatraka-internal:
    driver: bridge

